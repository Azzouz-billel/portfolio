<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Profile photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#11061f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>

  <!-- abstract icosahedron wireframe motif -->
  <g transform="translate(200 215)" fill="none" stroke="url(#stroke)" stroke-width="1.5" opacity="0.85">
    <polygon points="0,-90 80,-30 50,75 -50,75 -80,-30"/>
    <polygon points="0,-90 0,40 80,-30" opacity="0.6"/>
    <polygon points="0,-90 0,40 -80,-30" opacity="0.6"/>
    <polygon points="80,-30 0,40 50,75" opacity="0.6"/>
    <polygon points="-80,-30 0,40 -50,75" opacity="0.6"/>
    <line x1="0" y1="40" x2="50" y2="75"/>
    <line x1="0" y1="40" x2="-50" y2="75"/>
    <circle cx="0" cy="-90" r="3" fill="#38bdf8" stroke="none"/>
    <circle cx="80" cy="-30" r="3" fill="#22d3ee" stroke="none"/>
    <circle cx="-80" cy="-30" r="3" fill="#a855f7" stroke="none"/>
    <circle cx="50" cy="75" r="3" fill="#38bdf8" stroke="none"/>
    <circle cx="-50" cy="75" r="3" fill="#a855f7" stroke="none"/>
    <circle cx="0" cy="40" r="3" fill="#22d3ee" stroke="none"/>
  </g>

  <text x="200" y="430" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" letter-spacing="3" fill="#8b93a7">YOUR PHOTO HERE</text>
</svg>
